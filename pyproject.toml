[project]
name = "weldpath"
version = "0.1.0"
description = "Automatic weld seam extraction and collision-free torch path planning for robotic welding cells"
authors = [{ name = "Paweł Zarębski" }]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "cadquery-ocp (==8.0.1.1.0)",
    "numpy (>=2.0)",
    "python-fcl (>=0.7.0.11,<0.8.0.0)",
]

[tool.poetry]
packages = [{ include = "weldpath" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.6"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"